name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          npx --yes create-expo-app@latest ../app --template blank --no-install
          mkdir -p ../app/assets
          cp logo.png icon.png adaptive-icon.png splash-icon.png favicon.png skyscale.png ../app/assets/
          cp App.js firebase.js app.json metro.config.js ../app/
          cd ../app
          npm install
          npx expo install firebase @react-native-async-storage/async-storage expo-blur expo-linear-gradient expo-image-picker expo-document-picker expo-audio expo-splash-screen
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/GiggaChatz-v1.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v1-${{ github.run_number }}" GiggaChatz-v1.apk --title "Gigga Chatz v1" --notes "Download and install this APK on Android."
